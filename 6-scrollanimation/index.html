<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scroll Animation</title>
  <link rel="stylesheet" href="index.css">
  <script src="index2.js" defer></script>
</head>
<body>

  <header>
    <h2>헤더영역입니다.</h2>
  </header>

  <main>
    <h2>비주얼 영역입니다.</h2>
  </main>
  
  <!-- section 1 -->
  <section class="section section1">
    <div class="box scroll-item left-in">
      LEFT CONTENT
    </div>

    <div class="box scroll-item right-in">
      RIGHT CONTENT
    </div>
  </section>

  <!-- section 2 -->
  <section class="section section2">
    <div class="card scroll-item up-in">
      CARD 1
    </div>

    <div class="card scroll-item up-in delay1">
      CARD 2
    </div>

    <div class="card scroll-item up-in delay2">
      CARD 3
    </div>
  </section>

  <!-- section 3 -->
  <section class="section section3">
    <h2 class="title scroll-item top-in">
      TOP → DOWN
    </h2>

    <p class="text scroll-item zoom-in">
      SCALE EFFECT
    </p>

    <div class="circle scroll-item rotate-in">
      ROTATE
    </div>
  </section>

  <!-- section 4 -->
  <section class="section section4">
    <div class="list scroll-item cover">
      LIST 1
    </div>
    <div class="list scroll-item cover">
      LIST 2
    </div>
  </section>

</body>
</html>
