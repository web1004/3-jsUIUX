<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>플러그인을이용한자동슬라이드</title>
  <!-- Link Swiper's CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"/>
  <link rel="stylesheet" href="css/slide.css">
</head>
<body>
  
  <!-- Swiper -->
  <div class="swiper mySwiper">
    <div class="swiper-wrapper">
      <!-- (1)이미지 전체를 슬라이드하는 경우 -->
      <!-- 
      <div class="swiper-slide"><img src="image/banner-big-01.jpg" alt=""></div>
      <div class="swiper-slide"><img src="image/banner-big-02.jpg" alt=""></div>
      <div class="swiper-slide"><img src="image/banner-big-03.jpg" alt=""></div>
      <div class="swiper-slide"><img src="image/banner-big-04.jpg" alt=""></div>
      <div class="swiper-slide"><img src="image/banner-big-05.jpg" alt=""></div> 
      -->

      <!-- (2)이미지를 배경으로 넣고 텍스트를 넣는 경우 -->
      <div class="swiper-slide"><h2>Slide01</h2></div>
      <div class="swiper-slide"><h2>Slide02</h2></div>
      <div class="swiper-slide"><h2>Slide03</h2></div>
      <div class="swiper-slide"><h2>Slide04</h2></div>
      <div class="swiper-slide"><h2>Slide05</h2></div>
    </div>
    <div class="swiper-button-next"></div>
    <div class="swiper-button-prev"></div>
    <div class="swiper-pagination"></div>
  </div>


  <!-- Swiper's Script -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
  <!-- Initialize Swiper -->
  <script>
    var swiper = new Swiper(".mySwiper", {
      spaceBetween: 30,
      centeredSlides: true,
      autoplay: {
        delay: 3500,
        disableOnInteraction: false,
      },
      pagination: {
        el: ".swiper-pagination",
        clickable: true,
      },
      navigation: {
        nextEl: ".swiper-button-next",
        prevEl: ".swiper-button-prev",
      },
    });
  </script>
</body>
</html>
